name: CI

on:
  push:
    branches: [master, diffWay]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --verbose
        env:
          DEKO_DATABASE_URL: "sqlite::memory:"
          DEKO_ADMIN_PASSWORD: testpassword
          DEKO_API_KEY_SECRET: test-secret-key-12345678
          GEMINI_API_KEY: test-key

      - name: Run cargo-audit
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked || exit 0
          cargo audit

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t deko:latest .

      - name: Smoke test
        run: |
          docker run -d --name deko-test \
            -e DEKO_PORT=8000 \
            -e DEKO_ENV=dev \
            -e DEKO_ADMIN_PASSWORD=testpassword \
            -e DEKO_DATABASE_URL="sqlite:///data/deko.db" \
            -e DEKO_API_KEY_SECRET="test-secret-key-12345678" \
            -e GEMINI_API_KEY=testkey12345 \
            deko:latest
          sleep 8
          docker logs deko-test
          curl -fsS http://localhost:8000/health/live
          echo "container healthy"
          docker stop deko-test
          docker rm deko-test

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/master'
        run: |
          docker tag deko:latest ghcr.io/${{ github.repository }}:latest
          docker tag deko:latest ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }} --all-tags
